name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC federation to AWS
  contents: read
  pull-requests: write # plan output comments

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1

jobs:
  test-service:
    name: test generate service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/generate/package-lock.json
      - run: npm ci
        working-directory: services/generate
      - run: npm test
        working-directory: services/generate
      - run: npm run build
        working-directory: services/generate
      - uses: actions/upload-artifact@v4
        with:
          name: generate-dist
          path: services/generate/dist

  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - name: validate all roots
        run: |
          for dir in bootstrap envs/staging envs/production; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  plan:
    name: plan (${{ matrix.env }})
    if: vars.AWS_PLAN_ROLE_ARN != ''
    needs: [test-service, validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generate-dist
          path: services/generate/dist
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform -chdir=envs/${{ matrix.env }} init -input=false
      - id: plan
        run: |
          set +e
          output=$(terraform -chdir=envs/${{ matrix.env }} plan -no-color -input=false -detailed-exitcode 2>&1)
          exitcode=$?
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          echo "$output"
          {
            echo "stdout<<TFPLAN_EOF"
            echo "$output"
            echo "TFPLAN_EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0
      - if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_ENV: ${{ matrix.env }}
        with:
          script: |
            const exitcode = process.env.PLAN_EXITCODE;
            const status = exitcode === '0' ? '✅ No changes — up to date' : exitcode === '2' ? '⚠️ Changes pending' : '❌ Error';
            const output = `#### Terraform plan — \`${process.env.PLAN_ENV}\`: ${status}
            <details><summary>Show plan</summary>

            \`\`\`
            ${process.env.PLAN_STDOUT}
            \`\`\`

            </details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });
      - if: steps.plan.outputs.exitcode != 0 && steps.plan.outputs.exitcode != 2
        run: |
          echo "::error::terraform plan failed in envs/${{ matrix.env }}"
          exit 1
