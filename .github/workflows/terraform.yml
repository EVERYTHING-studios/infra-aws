name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC federation to AWS
  contents: read
  pull-requests: write # plan output comments

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1

jobs:
  test-service:
    name: test generate service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/generate/package-lock.json
      - run: npm ci
        working-directory: services/generate
      - run: npm test
        working-directory: services/generate
      - run: npm run build
        working-directory: services/generate
      - uses: actions/upload-artifact@v4
        with:
          name: generate-dist
          path: services/generate/dist

  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - name: validate all roots
        run: |
          for dir in bootstrap envs/staging envs/production; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  plan:
    name: plan (${{ matrix.env }})
    if: vars.AWS_PLAN_ROLE_ARN != ''
    needs: [test-service, validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generate-dist
          path: services/generate/dist
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform -chdir=envs/${{ matrix.env }} init -input=false
      - id: plan
        run: |
          set +e
          output=$(terraform -chdir=envs/${{ matrix.env }} plan -no-color -input=false -detailed-exitcode 2>&1)
          exitcode=$?
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          echo "$output"
          printf '%s\n' "$output" > "tfplan-${{ matrix.env }}.txt"
          if [ "$(wc -c < "tfplan-${{ matrix.env }}.txt")" -gt 60000 ]; then
            {
              echo "_Plan output truncated to the last 60 KB — see the full log in this job._"
              tail -c 60000 "tfplan-${{ matrix.env }}.txt"
            } > "tfplan-${{ matrix.env }}.tmp"
            mv "tfplan-${{ matrix.env }}.tmp" "tfplan-${{ matrix.env }}.txt"
          fi
          exit 0
      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          PLAN_ENV: ${{ matrix.env }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$PLAN_EXITCODE" in
            0) status='✅ No changes — up to date' ;;
            2) status='⚠️ Changes pending' ;;
            *) status='❌ Error' ;;
          esac
          {
            echo "#### Terraform plan — \`$PLAN_ENV\`: $status"
            echo '<details><summary>Show plan</summary>'
            echo
            echo '```'
            cat "tfplan-$PLAN_ENV.txt"
            echo '```'
            echo
            echo '</details>'
          } > plan-comment.md
          gh pr comment "$PR_NUMBER" --body-file plan-comment.md
      - if: steps.plan.outputs.exitcode != 0 && steps.plan.outputs.exitcode != 2
        run: |
          echo "::error::terraform plan failed in envs/${{ matrix.env }}"
          exit 1
