name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC federation to AWS
  contents: read
  pull-requests: write # plan output comments

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1

jobs:
  test-service:
    name: test generate service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/generate/package-lock.json
      - run: npm ci
        working-directory: services/generate
      - run: npm test
        working-directory: services/generate
      - run: npm run build
        working-directory: services/generate
      - uses: actions/upload-artifact@v4
        with:
          name: generate-dist
          path: services/generate/dist

  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - name: validate all roots
        run: |
          for dir in bootstrap envs/staging envs/production; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  plan:
    name: plan (${{ matrix.env }})
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: [test-service, validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generate-dist
          path: services/generate/dist
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform -chdir=envs/${{ matrix.env }} init -input=false
      - id: plan
        run: terraform -chdir=envs/${{ matrix.env }} plan -no-color -input=false
        continue-on-error: true
      - uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform plan — \`${{ matrix.env }}\`: \`${{ steps.plan.outcome }}\`
            <details><summary>Show plan</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });
      - if: steps.plan.outcome == 'failure'
        run: exit 1

  apply-staging:
    name: apply staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_APPLY_ROLE_ARN != ''
    needs: [test-service, validate]
    runs-on: ubuntu-latest
    environment: staging
    concurrency: apply-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generate-dist
          path: services/generate/dist
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform -chdir=envs/staging init -input=false
      - run: terraform -chdir=envs/staging apply -auto-approve -input=false

  apply-production:
    name: apply production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_APPLY_ROLE_ARN != ''
    needs: [apply-staging]
    runs-on: ubuntu-latest
    environment: production # gate with required reviewers in repo settings
    concurrency: apply-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generate-dist
          path: services/generate/dist
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform -chdir=envs/production init -input=false
      - run: terraform -chdir=envs/production apply -auto-approve -input=false
